<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>DAR | Home & Living</title><style>*{box-sizing:border-box}body{margin:0;background:#f8f7f4;color:#252525;font-family:Arial,sans-serif}button,input{font:inherit}button{cursor:pointer;border:0}.app{max-width:520px;margin:auto;min-height:100dvh}.welcome{height:100dvh;position:relative;background:#e7dfd0;overflow:hidden}.welcome img{width:100%;height:100%;object-fit:cover}.overlay{position:absolute;inset:0;background:linear-gradient(180deg,#0004,transparent 40%,#0009)}.brand{font-family:Georgia,serif;font-size:46px;letter-spacing:9px;color:white}.welcome .brand{position:absolute;top:9%;width:100%;text-align:center}.intro{position:absolute;bottom:9%;left:7%;right:7%;color:white;text-align:center}.intro h1{font:italic 35px Georgia,serif}.primary{background:#17342f;color:white;border-radius:18px;padding:16px 22px;width:100%;font-weight:bold}.intro .primary{margin-top:24px}.screen{padding:22px 18px 115px}.head{display:flex;align-items:center;justify-content:space-between;margin:5px 0 25px}.head .brand{font-size:29px;color:#17342f}.circle{background:white;border-radius:50%;padding:12px}.section-title{font:30px Georgia,serif;margin:18px 0}.hero{height:230px;border-radius:24px;overflow:hidden;position:relative}.hero img{width:100%;height:100%;object-fit:cover}.hero .overlay{background:linear-gradient(90deg,#0008,transparent)}.hero-copy{position:absolute;bottom:25px;left:20px;color:white}.hero-copy h2{font:29px Georgia,serif;max-width:230px}.hero-copy button{padding:11px 18px;background:#f8f7f4;border-radius:25px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.tile{overflow:hidden;border-radius:20px;background:white;text-align:left;padding:0;color:#252525}.tile img{width:100%;height:170px;object-fit:cover;display:block}.tile .details{padding:11px}.tile strong{font-size:14px}.tile small{display:block;color:#666;margin-top:6px}.chips{display:flex;gap:9px;overflow:auto;padding:8px 0 18px}.chip{white-space:nowrap;border-radius:24px;background:#eeeae2;padding:11px 15px}.chip.active{background:#17342f;color:white}.search{width:100%;border:0;border-radius:18px;padding:17px;background:white;margin-bottom:12px}.service{background:#eeeae2;border-radius:22px;min-height:165px;padding:18px;text-align:left;color:#17342f;display:flex;flex-direction:column;justify-content:space-between}.service .symbol{font-size:34px}.service strong{font-size:16px}.service small{color:#686761}.nav{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);max-width:480px;width:calc(100% - 30px);border-radius:25px;background:#17342f;display:flex;justify-content:space-around;padding:10px 4px;z-index:5}.nav button{background:transparent;color:#cbd1cd;font-size:11px;padding:10px 8px;border-radius:18px}.nav button.active{background:#d7c5a9;color:#17342f}.nav span{display:block;font-size:22px;margin-bottom:5px}.back{background:none;color:#17342f;font-size:18px;padding:12px 0}.detail-img{width:100%;height:360px;object-fit:cover;border-radius:22px}.price{font-size:23px;color:#17342f;font-weight:bold}.card{background:white;padding:18px;border-radius:20px;margin:12px 0}.line{display:flex;justify-content:space-between;align-items:center;gap:12px}.muted{color:#777}.counter{display:flex;align-items:center;gap:16px}.counter button{padding:8px 13px;border-radius:10px;background:#eeeae2}.empty{text-align:center;padding:70px 20px;color:#777}label{display:block;margin:12px 0 6px}input,textarea{width:100%;padding:13px;border:1px solid #ddd;border-radius:12px}textarea{min-height:90px} .tag{background:#eeeae2;border-radius:10px;padding:8px 10px;font-size:12px}</style></head><body><div class="app" id="app"></div><script>
const photos={welcome:'https://images.unsplash.com/photo-1567538096630-e0c55bd6374c?w=1100&q=85',living:'https://images.unsplash.com/photo-1600210492486-724fe5c67fb0?w=1100&q=85',chair:'https://images.unsplash.com/photo-1503602642458-232111445657?w=700&q=85',sofa:'https://images.unsplash.com/photo-1555041469-a586c61ea9bc?w=700&q=85',table:'https://images.unsplash.com/photo-1499933374294-4584851497cc?w=700&q=85',lamp:'https://images.unsplash.com/photo-1507473885765-e6ed057f782c?w=700&q=85',bed:'https://images.unsplash.com/photo-1505693416388-ac5ce068fe85?w=700&q=85',decor:'https://images.unsplash.com/photo-1618221195710-dd6b41faaea6?w=700&q=85'};
const products=[['Modern Lounge Chair','Chairs',89,'chair'],['Scandinavian Chair','Chairs',65,'chair'],['Oak Accent Chair','Chairs',79,'chair'],['Designer Dining Chair','Chairs',45,'chair'],['Cream Living Sofa','Sofas',249,'sofa'],['Olive Green Sofa','Sofas',199,'sofa'],['Contemporary Sofa','Sofas',289,'sofa'],['Compact Two Seat Sofa','Sofas',179,'sofa'],['Oak Coffee Table','Tables',59,'table'],['Dining Table','Tables',179,'table'],['Wooden Side Table','Tables',35,'table'],['Modern Work Desk','Tables',110,'table'],['Warm Pendant Light','Lighting',49,'lamp'],['Minimalist Floor Lamp','Lighting',35,'lamp'],['Bedside Lamp','Lighting',22,'lamp'],['Designer Ceiling Light','Lighting',69,'lamp'],['Luxury Bed Frame','Bedroom',220,'bed'],['Cozy Bedroom Set','Bedroom',380,'bed'],['Modern Bed','Bedroom',260,'bed'],['Soft Headboard Bed','Bedroom',190,'bed'],['Decorative Vase','Decor',15,'decor'],['Wall Decor Set','Decor',32,'decor'],['Neutral Home Accessories','Decor',26,'decor'],['Living Room Accessories','Decor',44,'decor'],['Classic Lounge Chair','Chairs',99,'chair'],['Modern Sofa Collection','Sofas',320,'sofa'],['Wood Console','Tables',125,'table'],['Bedroom Lamp','Lighting',28,'lamp'],['Premium Bedroom Furniture','Bedroom',410,'bed'],['Modern Interior Decor','Decor',54,'decor']].map((x,i)=>({id:i,name:x[0],cat:x[1],price:x[2],image:photos[x[3]]}));
const services=[['Electrical Repairs','Sockets & lighting','⚡',8],['Plumbing','Leaks & fittings','🔧',8],['Air Conditioning','Cleaning & repair','❄',12],['Carpentry','Doors & shelves','🪚',10],['Painting','Walls & rooms','▰',45],['Furniture Assembly','Furniture installation','▣',7],['Bathroom Renovation','Design & renovation','▤',35],['Home Cleaning','Professional cleaning','✦',15]];
let state={page:'welcome',cat:'All',search:'',item:null,service:null,cart:[],orders:[],favorites:[],welcomeSeen:false};const app=document.getElementById('app');const money=n=>'KWD '+n.toFixed(3);const img=(src,cls='')=>`<img class="${cls}" src="${src}" alt="Furniture photograph" onerror="this.style.background='#ded8cc';this.alt='Image unavailable'">`;
function go(page){state.page=page;render();window.scrollTo(0,0)}function product(id){state.item=id;go('product')}function category(c){state.cat=c;go('shop')}function add(id){let line=state.cart.find(x=>x.id===id);line?line.qty++:state.cart.push({id,qty:1});render()}function nav(){return `<nav class="nav">${[['home','⌂','Home'],['shop','▣','Shop'],['services','⚒','Services'],['orders','▤','Orders'],['profile','♙','Profile']].map(x=>`<button class="${state.page===x[0]?'active':''}" onclick="go('${x[0]}')"><span>${x[1]}</span>${x[2]}</button>`).join('')}</nav>`}function head(){return `<div class="head"><div class="brand">DAR</div><button class="circle" onclick="go('cart')">🛒 ${state.cart.reduce((a,x)=>a+x.qty,0)}</button></div>`}function tiles(list){return `<div class="grid">${list.map(p=>`<button class="tile" onclick="product(${p.id})">${img(p.image)}<div class="details"><strong>${p.name}</strong><small>${money(p.price)}</small></div></button>`).join('')}</div>`}
function render(){let html='';if(state.page==='welcome'){html=`<section class="welcome">${img(photos.welcome)}<div class="overlay"></div><div class="brand">DAR</div><div class="intro"><h1>Create a home you love.</h1><p>Furniture, living & home services</p><button class="primary" onclick="go('home')">Get Started →</button></div></section>`}else if(state.page==='home'){html=`<div class="screen">${head()}<div class="hero">${img(photos.living)}<div class="overlay"></div><div class="hero-copy"><h2>Make room for beautiful living.</h2><button onclick="category('All')">Shop Collection →</button></div></div><h2 class="section-title">Explore collections</h2><div class="grid">${[['Chairs','chair'],['Sofas','sofa'],['Tables','table'],['Bedroom','bed'],['Lighting','lamp'],['Decor','decor']].map(c=>`<button class="tile" onclick="category('${c[0]}')">${img(photos[c[1]])}<div class="details"><strong>${c[0]} →</strong></div></button>`).join('')}</div><h2 class="section-title">Curated for you</h2>${tiles(products.slice(0,4))}<h2 class="section-title">Home services</h2><button class="primary" onclick="go('services')">Explore home services →</button></div>${nav()}`}else if(state.page==='shop'){let list=products.filter(p=>(state.cat==='All'||p.cat===state.cat)&&p.name.toLowerCase().includes(state.search.toLowerCase()));html=`<div class="screen">${head()}<h1 class="section-title">Shop</h1><input class="search" placeholder="Search furniture..." value="${state.search}" oninput="state.search=this.value;drawProducts()"><div class="chips">${['All','Chairs','Sofas','Tables','Lighting','Bedroom','Decor'].map(c=>`<button class="chip ${state.cat===c?'active':''}" onclick="category('${c}')">${c}</button>`).join('')}</div><div id="product-grid">${tiles(list)}</div><p class="muted">Sample products and demo prices only.</p></div>${nav()}`}else if(state.page==='product'){let p=products[state.item];html=`<div class="screen"><button class="back" onclick="go('shop')">← Back to Shop</button>${img(p.image,'detail-img')}<h1 class="section-title">${p.name}</h1><div class="line"><span class="price">${money(p.price)}</span><button class="circle" onclick="favorite(${p.id})">${state.favorites.includes(p.id)?'♥':'♡'}</button></div><p class="muted">A beautiful piece for a modern home. Sample furniture listing for the DAR interactive demo.</p><div class="card">Category: ${p.cat}<br><br>Delivery across Kuwait (demo)</div><button class="primary" onclick="add(${p.id});go('cart')">Add to Cart →</button></div>${nav()}`}else if(state.page==='services'){html=`<div class="screen">${head()}<h1 class="section-title">Home services</h1><p class="muted">Choose a service and book a demo appointment.</p><div class="grid">${services.map((s,i)=>`<button class="service" onclick="state.service=${i};go('booking')"><span class="symbol">${s[2]}</span><div><strong>${s[0]}</strong><br><small>${s[1]}</small></div></button>`).join('')}</div></div>${nav()}`}else if(state.page==='booking'){let s=services[state.service];html=`<div class="screen"><button class="back" onclick="go('services')">← Services</button><h1 class="section-title">${s[0]}</h1><div class="card"><h2>${s[2]} ${s[0]}</h2><p>${s[1]}</p><strong>Starting from ${money(s[3])} (demo)</strong></div><label>Appointment date</label><input type="date" id="date" min="${new Date().toISOString().slice(0,10)}"><label>Preferred time</label><input type="time" id="time" value="11:00"><label>Address in Kuwait</label><input id="address" placeholder="Area, block, street"><label>Describe your request</label><textarea id="description" placeholder="Tell us what needs fixing"></textarea><br><br><button class="primary" onclick="book()">Confirm Demo Booking</button></div>${nav()}`}else if(state.page==='cart'){let total=state.cart.reduce((a,x)=>a+products[x.id].price*x.qty,0);html=`<div class="screen"><button class="back" onclick="go('shop')">← Shop</button><h1 class="section-title">Your Cart</h1>${state.cart.length?state.cart.map(x=>`<div class="card line"><div><strong>${products[x.id].name}</strong><p>${money(products[x.id].price)}</p></div><div class="counter"><button onclick="changeQty(${x.id},-1)">−</button>${x.qty}<button onclick="changeQty(${x.id},1)">+</button></div></div>`).join('')+`<div class="card line"><strong>Total</strong><strong>${money(total)}</strong></div><button class="primary" onclick="checkout()">Place Demo Order</button>`:'<div class="empty">Your cart is empty.</div>'}</div>${nav()}`}else if(state.page==='orders'){html=`<div class="screen">${head()}<h1 class="section-title">Orders & bookings</h1>${state.orders.length?state.orders.map(o=>`<div class="card"><strong>${o.title}</strong><p>${o.type} · ${o.date||'Today'}</p><span class="tag">Demo confirmed</span></div>`).join(''):'<div class="empty">No orders yet. Explore the shop or book a service.</div>'}<p class="muted">All orders and bookings are demo data.</p></div>${nav()}`}else if(state.page==='profile'){html=`<div class="screen">${head()}<h1 class="section-title">Your DAR</h1><div class="card">Welcome to your home marketplace demo.</div><button class="primary" onclick="go('welcome')">View Welcome Screen</button><h2 class="section-title">Favorites</h2>${tiles(products.filter(p=>state.favorites.includes(p.id)))}</div>${nav()}`}app.innerHTML=html}function drawProducts(){let list=products.filter(p=>(state.cat==='All'||p.cat===state.cat)&&p.name.toLowerCase().includes(state.search.toLowerCase()));document.getElementById('product-grid').innerHTML=tiles(list)}function favorite(id){state.favorites.includes(id)?state.favorites=state.favorites.filter(x=>x!==id):state.favorites.push(id);render()}function changeQty(id,d){let x=state.cart.find(x=>x.id===id);x.qty+=d;if(x.qty<=0)state.cart=state.cart.filter(y=>y.id!==id);render()}function checkout(){state.orders.unshift({type:'Furniture purchase',title:state.cart.map(x=>products[x.id].name).join(', ')});state.cart=[];go('orders')}function book(){let date=document.getElementById('date').value,address=document.getElementById('address').value;if(!date||!address.trim()){alert('Please enter a date and address.');return}state.orders.unshift({type:'Service booking',title:services[state.service][0],date});go('orders')}render();
</script></body></html>
